// gas giant (Rouqea), and barycenter (SimeSystem) excluded.
// Colors derived from Kcalbeloh GitHub config color data and body themes.

// Suluco system (inner orbiting black hole)
LOSKET_BODY_DUST:NEEDS[KcalbelohSystem&Losket] { body = Suluco     color = 0.45, 0.30, 0.20 }
LOSKET_BODY_DUST:NEEDS[KcalbelohSystem&Losket] { body = Arorua     color = 0.55, 0.50, 0.40 }

