// Losket Dust Color Compatibility Patch — Outer Planets Mod (OPM)
// Adds dust color entries for all landable OPM bodies.
// Gas giants (Sarnus, Urlum, Neidon) excluded — no surface to land on.
// Colors derived from each body's HeightColorMap terrain palette.
// Eeloo is excluded — it's a stock body relocated by OPM, already in Losket's defaults.

// Sarnus moons
LOSKET_BODY_DUST:NEEDS[OPM&Losket] { body = Hale       color = 0.73, 0.64, 0.61 }
LOSKET_BODY_DUST:NEEDS[OPM&Losket] { body = Ovok       color = 0.67, 0.65, 0.78 }
LOSKET_BODY_DUST:NEEDS[OPM&Losket] { body = Slate      color = 0.45, 0.38, 0.33 }
LOSKET_BODY_DUST:NEEDS[OPM&Losket] { body = Tekto      color = 0.42, 0.35, 0.26 }

// Urlum moons
LOSKET_BODY_DUST:NEEDS[OPM&Losket] { body = Polta      color = 0.44, 0.53, 0.44 }
LOSKET_BODY_DUST:NEEDS[OPM&Losket] { body = Priax      color = 0.38, 0.36, 0.32 }
LOSKET_BODY_DUST:NEEDS[OPM&Losket] { body = Wal        color = 0.52, 0.44, 0.30 }
LOSKET_BODY_DUST:NEEDS[OPM&Losket] { body = Tal        color = 0.40, 0.36, 0.29 }

// Neidon moons
LOSKET_BODY_DUST:NEEDS[OPM&Losket] { body = Thatmo     color = 0.72, 0.75, 0.70 }
LOSKET_BODY_DUST:NEEDS[OPM&Losket] { body = Nissee     color = 0.76, 0.67, 0.52 }

// Outer dwarf planets
LOSKET_BODY_DUST:NEEDS[OPM&Losket] { body = Plock      color = 0.60, 0.54, 0.46 }
LOSKET_BODY_DUST:NEEDS[OPM&Losket] { body = Karen      color = 0.65, 0.52, 0.33 }
