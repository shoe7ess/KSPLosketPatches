// Losket Dust Color Patch - OPX (Outer Planets Expansion)
// Covers OPX:JoolPlus and OPX:SarnusPlus bodies
// Colors derived from real-world analog appearances
// JoolPlus: Metis/Amalthea/Callisto/Himalia analogs + trojans
// SarnusPlus: Pan/Mimas/Enceladus/Hyperion/Phoebe analogs

// JoolPlus bodies
@Kopernicus:AFTER[OPX]:NEEDS[OPX&Losket]
{
    // Meto - Metis analog, small dark inner moon
    LOSKET_BODY_DUST
    {
        name = Meto
        R = 0.35
        G = 0.30
        B = 0.25
    }
    // Alnes - Amalthea analog, reddish irregular moon
    LOSKET_BODY_DUST
