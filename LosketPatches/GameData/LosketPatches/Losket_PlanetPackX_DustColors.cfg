// Losket Dust Color Patch - Planet Pack X
// Adds dust colors for PlanetPackX bodies
// Colors derived from HeightColorMap terrain bands

@Kopernicus:AFTER[PlanetPackX]:NEEDS[PlanetPackX&Losket]
{
    LOSKET_BODY_DUST
    {
        name = Odo
        R = 0.62
        G = 0.39
        B = 0.26
    }
    LOSKET_BODY_DUST
    {
        name = Yekcha
        R = 0.69
        G = 0.54
        B = 0.27
    }
}
