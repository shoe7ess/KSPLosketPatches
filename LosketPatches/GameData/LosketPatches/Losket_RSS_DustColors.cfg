// Losket Dust Color Compatibility Patch — Real Solar System (RSS)
// Adds dust color entries for all landable RSS bodies.
// Gas giants (Jupiter, Saturn, Uranus, Neptune) and the Sun excluded.
// Colors based on actual surface appearance from NASA imagery and
// RSS Kopernicus terrain color values.

// Inner planets
LOSKET_BODY_DUST:NEEDS[RealSolarSystem&Losket] { body = Mercury    color = 0.32, 0.32, 0.35 }
LOSKET_BODY_DUST:NEEDS[RealSolarSystem&Losket] { body = Venus      color = 0.70, 0.38, 0.16 }
LOSKET_BODY_DUST:NEEDS[RealSolarSystem&Losket] { body = Earth      color = 0.42, 0.36, 0.28 }
LOSKET_BODY_DUST:NEEDS[RealSolarSystem&Losket] { body = Moon       color = 0.40, 0.40, 0.40 }

// Mars system
