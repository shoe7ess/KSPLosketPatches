// Dust colour lifted by engines, per celestial body.
//
// Intentionally declarative table: sampling the terrain texture
// would not match what the player sees once Parallax is installed.
// Planet mods can add their own bodies with a simple MM patch:
//
//   LOSKET_BODY_DUST { body = MyBody  color = 0.5, 0.4, 0.3 }
//
// Without an entry, the plugin falls back to a neutral grey-brown.

LOSKET_BODY_DUST { body = Kerbin   color = 0.42, 0.36, 0.28 }
LOSKET_BODY_DUST { body = Mun      color = 0.44, 0.43, 0.41 }
LOSKET_BODY_DUST { body = Minmus   color = 0.62, 0.68, 0.62 }
LOSKET_BODY_DUST { body = Moho     color = 0.38, 0.33, 0.29 }
LOSKET_BODY_DUST { body = Eve      color = 0.45, 0.35, 0.48 }
LOSKET_BODY_DUST { body = Gilly    color = 0.35, 0.31, 0.27 }
LOSKET_BODY_DUST { body = Duna     color = 0.55, 0.33, 0.21 }
LOSKET_BODY_DUST { body = Ike      color = 0.36, 0.36, 0.37 }
LOSKET_BODY_DUST { body = Dres     color = 0.40, 0.39, 0.37 }
LOSKET_BODY_DUST { body = Laythe   color = 0.36, 0.33, 0.27 }
LOSKET_BODY_DUST { body = Vall     color = 0.60, 0.65, 0.70 }
