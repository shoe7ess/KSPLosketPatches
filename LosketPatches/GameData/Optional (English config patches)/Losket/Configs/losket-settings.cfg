// Global Losket settings with no in-game interface.
//
// These values are read at startup and are not exposed in the game's
// difficulty settings menu: that screen space is reserved for day-to-day choices.
// A ModuleManager patch can override them:
//
//   @LOSKET_SETTINGS { @dustMinPressureAtm = 0 }

LOSKET_SETTINGS
{
	// Pressure (in atmospheres) below which engines no longer
	// kick up dust. By default dust is disabled in vacuum: technically
	// functional, it was not convincing in practice
	// (a grazing sheet on the flanks is hard to read). Set to 0 to enable it
	// everywhere, including on the Mun and Minmus. The "Dust in vacuum"
	// checkbox in Losket settings does the same thing without a patch; this
	// threshold only applies when that option is unchecked.
	dustMinPressureAtm = 0.01

	// Volumetric Clouds dust storms (Blackrack). Without that mod,
	// these values have no effect. A vessel inside a storm is coated
	// with the body's dust even when sitting on a runway during time warp.
	stormDust = true
	// A cloud layer counts as a storm if its name contains this word.
	stormLayerKeyword = dust
	// Layer coverage (0..1): below the minimum, no storm; at the
	// maximum, full storm.
	stormCoverageMin = 0.2
	stormCoverageMax = 0.75
	// Game-time seconds inside a full storm to coat a part to ~63%.
	stormDustTime = 7200
}
