// DEVELOPMENT patches for Losket.

// Preview: shader tuning sliders in the right-click menu,
// on stock capsules. Will be removed once the rendering is finalised.
@PART[mk1pod_v2|mk1-3pod]:FOR[Losket]
{
	MODULE
	{
		name = ModuleLosketBurnPreview
	}
}

// In-flight accumulation: all parts. The module is inert until the
// part experiences heat flux (overlay created at the first 2% of burn),
// so the cost on a clean vessel is zero. Kerbals on EVA and asteroids
// are excluded: their "parts" are not hulls.
@PART[*]:HAS[!MODULE[KerbalEVA],!MODULE[ModuleAsteroid],!MODULE[ModuleComet]]:FOR[Losket]
{
	MODULE
	{
		name = ModuleLosketBurn
	}
	MODULE
	{
		name = ModuleLosketDust
	}
	// Engine plume marks: same inertia, nothing is rendered until
	// a jet has actually hit the part.
	MODULE
	{
		name = ModuleLosketExhaust
	}
}
